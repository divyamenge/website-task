
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rolex Shopping Store</title>

    <style>

        /* ================= GENERAL ================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #222;
        }


        /* ================= NAVBAR ================= */

        nav {
            background-color: #006039;
            padding: 15px 40px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            position: sticky;
            top: 0;
            z-index: 1000;

            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
        }

        .logo {
            color: white;
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .nav-links a:hover {
            color: #d4af37;
        }


        /* ================= SEARCH ================= */

        .search-box {
            display: flex;
        }

        .search-box input {
            width: 220px;
            padding: 10px 15px;

            border: none;
            outline: none;

            border-radius: 20px 0 0 20px;
        }

        .search-box button {
            padding: 10px 15px;

            border: none;

            background-color: #d4af37;

            cursor: pointer;

            font-weight: bold;

            border-radius: 0 20px 20px 0;
        }


        /* ================= HERO ================= */

        .hero {
            background-color: #006039;

            color: white;

            text-align: center;

            padding: 70px 20px;
        }

        .hero h1 {
            font-size: 48px;
            letter-spacing: 4px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 20px;
            margin-bottom: 25px;
        }

        .shop-btn {
            display: inline-block;

            padding: 12px 30px;

            background-color: #d4af37;
            color: black;

            text-decoration: none;

            border-radius: 25px;

            font-weight: bold;

            transition: 0.3s;
        }

        .shop-btn:hover {
            background-color: white;
            transform: scale(1.05);
        }


        /* ================= CATEGORIES ================= */

        .categories {
            text-align: center;
            padding: 40px 20px;
        }

        .categories h2 {
            color: #006039;
            margin-bottom: 25px;
        }

        .category-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .category {
            background-color: white;

            padding: 12px 25px;

            border: 2px solid #006039;

            border-radius: 25px;

            cursor: pointer;

            transition: 0.3s;
        }

        .category:hover {
            background-color: #006039;
            color: white;
            transform: translateY(-5px);
        }


        /* ================= PRODUCTS ================= */

        .products {
            padding: 30px 40px;
        }

        .products h2 {
            text-align: center;

            color: #006039;

            font-size: 32px;

            margin-bottom: 30px;
        }

        .product-container {
            display: flex;

            justify-content: center;

            gap: 25px;

            flex-wrap: wrap;
        }


        /* ================= PRODUCT CARD ================= */

        .product {
            width: 280px;

            background-color: white;

            padding: 15px;

            border-radius: 15px;

            position: relative;

            overflow: hidden;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);

            transition: 0.4s;
        }

        .product:hover {
            transform: translateY(-10px);

            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.25);
        }


        /* ================= DISCOUNT ================= */

        .discount {
            position: absolute;

            top: 15px;
            left: 15px;

            background-color: #e63946;

            color: white;

            padding: 6p;}
